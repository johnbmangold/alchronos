name: alchronos
description: A timer to help with the safer consumption of alcohol.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.1 <4.0.0'

dependencies:
  animations: ^2.0.7
  avatar_glow: ^3.0.1
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  dynamic_color: ^1.6.6
  firebase_core: ^3.1.0
  firebase_crashlytics: ^4.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_local_notifications: ^17.1.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.1
  flutter_secure_storage: ^9.0.0
  get_it: ^8.0.1
  injectable: ^2.4.4
  intl: any
  logger: ^2.0.1
  lottie: ^3.1.2
  meta: ^1.9.1
  path_provider: ^2.1.0
  wave: ^0.2.2
  workmanager: ^0.5.2

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.4.2
  integration_test:
    sdk: flutter
  mockito: ^5.4.2
  very_good_analysis: ^6.0.0

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#f8bbd0"
    theme_color: "#f8bbd0"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/lottie/activeDrinkDark.json
    - assets/lottie/activeDrinkLight.json
    - assets/lottie/waitDrinkDark.json
    - assets/lottie/waitDrinkLight.json
