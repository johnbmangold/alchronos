name: alchronos
description: A timer to help with the safer consumption of alcohol.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  animations: ^2.0.7
  avatar_glow: ^3.0.1
  cupertino_icons: ^1.0.8
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  dynamic_system_colors: ^1.8.0
  firebase_core: ^3.1.0
  firebase_crashlytics: ^4.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_local_notifications: ^19.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0-beta.4
  get_it: ^8.0.1
  injectable: ^2.4.4
  intl: ^0.20.2
  logger: ^2.0.1
  lottie: ^3.1.2
  meta: ^1.9.1
  wave: ^0.2.2
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.18.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.4.2
  integration_test:
    sdk: flutter
  mockito: ^5.4.2
  very_good_analysis: ^9.0.0

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#f8bbd0"
    theme_color: "#f8bbd0"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/lottie/activeDrinkDark.json
    - assets/lottie/activeDrinkLight.json
    - assets/lottie/waitDrinkDark.json
    - assets/lottie/waitDrinkLight.json
