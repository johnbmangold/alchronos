workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      groups:
        - google_play
        - firebase_test_lab
      android_signing:
        - AlchronosRelease
      vars:
        PACKAGE_NAME: "com.idlewild.alchronos"
        GOOGLE_PLAY_TRACK: "internal"
        EW_APK_PATH: "build/app/outputs/apk/debug/app-debug.apk"
        EW_TEST_APK_PATH: "build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
        FIREBASE_PROJECT: "alchronos"
      flutter: stable
      java: 17
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns: 
        - pattern: '*'
        - pattern: develop
          include: false
      cancel_previous_builds: false
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Code Generator
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Flutter Unit tests
        script: | 
          mkdir -p test-results
          flutter test --machine > test-results/flutter_unit.json
        test_report: test-results/flutter_unit.json
        ignore_failure: false
      - name: Build AAB with Flutter
        script: |
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK") + 1))      
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
      - name: Zip Android symbols
        script: |
          zip -r build/app/outputs/bundle/release/app-symbols.zip build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - build/**/outputs/**/*.zip
    publishing:
      email:
        recipients:
          - johnbmangold@gmail.com
        notify:
          success: false
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK